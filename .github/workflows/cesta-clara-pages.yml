name: Publicar Cesta Clara

on:
  push:
    branches: [main]
    paths:
      - public/cesta-clara.html
      - public/cesta-clara-*.js
      - .github/workflows/cesta-clara-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar sitio
        run: |
          mkdir -p _site
          cp public/cesta-clara.html _site/index.html
          cp public/cesta-clara-*.js _site/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
