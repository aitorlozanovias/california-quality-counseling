<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102038">
  <title>Family Trip Shopping List</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102038,#23446d);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;padding:24px}.card{width:min(560px,100%);padding:28px;border:1px solid rgba(255,255,255,.22);border-radius:22px;background:rgba(255,255,255,.1);box-shadow:0 24px 70px rgba(0,0,0,.28);backdrop-filter:blur(14px)}h1{margin:0 0 10px;font-size:clamp(1.7rem,6vw,2.6rem);line-height:1.05}p{margin:0;color:#dbe7f6;line-height:1.5}.loader{height:8px;margin-top:22px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}.loader span{display:block;width:42%;height:100%;border-radius:inherit;background:#f59e0b;animation:move 1.2s ease-in-out infinite alternate}.error{display:none;margin-top:18px;padding:13px;border-radius:12px;background:#fee2e2;color:#7f1d1d}@keyframes move{from{transform:translateX(-15%)}to{transform:translateX(155%)}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Loading the shared family checklist</h1>
    <p>This version uses a cloud record so changes made on either phone can synchronize.</p>
    <div class="loader" aria-label="Loading"><span></span></div>
    <div id="error" class="error">The checklist could not load. Refresh the page or try again in a moment.</div>
  </main>
<script>
(async()=>{
  try{
    const source='https://raw.githubusercontent.com/aitorlozanovias/california-quality-counseling/main/trip-shopping.html?hosted=1';
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok)throw new Error('Source unavailable');
    let html=await response.text();

    html=html.replace("const STORAGE_API = 'https://api.jsonstorage.net/v1/json';","const STORAGE_API = 'https://jsonblob.com/api/jsonBlob';");
    html=html.replace("const LOCAL_PREFIX = 'family-trip-shopping-v3';","const LOCAL_PREFIX = 'family-trip-shopping-v4';");
    html=html.replace('Anyone with the exact shared link can view and edit this checklist.','Both phones use the same cloud checklist. Anyone with the exact shared link can view and edit it.');

    html=html.replace(/async function createRoom\(\)\{[\s\S]*?\n\}\nasync function fetchRemote\(\)\{/,
`async function createRoom(){
  setSync('saving','Creating shared list…');
  const payload={...state,updatedAt:now(),updatedBy:CLIENT_ID};
  const r=await fetch(STORAGE_API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('Room creation failed');
  const locationHeader=r.headers.get('Location')||r.headers.get('location');
  if(!locationHeader) throw new Error('No shared-room location returned');
  roomUri=locationHeader.replace(/\\s+/g,'');
  history.replaceState(null,'',location.pathname+location.search+'#room='+encodeRoom(roomUri));
  state=payload;saveLocal();lastRemoteJson=JSON.stringify(payload);
  setSync('online','Shared and up to date');el('lastSync').textContent='Synced '+formatTime(now());
  toast('Shared checklist created. Use Share list to invite your wife.');
}
async function fetchRemote(){`);

    html=html.replace(/async function fetchRemote\(\)\{[\s\S]*?\n\}\nasync function putRemote\(next\)\{/,
`async function fetchRemote(){
  if(!roomUri)return null;
  const r=await fetch(roomUri,{cache:'no-store',headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('Fetch failed');
  return normalizeState(await r.json());
}
async function putRemote(next){`);

    html=html.replace(/async function putRemote\(next\)\{[\s\S]*?\n\}\nasync function syncNow/,
`async function putRemote(next){
  const r=await fetch(roomUri,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(next)});
  if(!r.ok)throw new Error('Save failed');
}
async function syncNow`);

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('error').style.display='block';
  }
})();
</script>
</body>
</html>
